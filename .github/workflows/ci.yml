name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow duckdb PyYAML statsmodels lifelines pytest ruff

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest tests/ -q

      # The pipeline runs end to end on every PR against a fixed seed. This is
      # what stops a "small" change to a transformation from silently altering
      # the cohort: if the counts move, the reviewer sees it in the diff of the
      # CI log rather than discovering it after the analysis is published.
      - name: End-to-end smoke run
        run: python -m src.pipeline all

      - name: Assert QC gate did not fail
        run: |
          python - <<'PY'
          import json, pathlib
          rep = sorted(pathlib.Path("data/metadata").rglob("validation_report.json"))[-1]
          summary = json.loads(rep.read_text())["summary"]
          print(summary)
          assert summary["gate"] != "FAIL", "QC gate failed on the reference dataset"
          PY

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts
          path: |
            data/metadata/**
            data/results/**
